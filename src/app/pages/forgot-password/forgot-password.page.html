<ion-content class="pw-page" [fullscreen]="true">
  <div class="pw-shell">
    <header class="pw-brand">
      <img
        src="assets/logo (2).png"
        alt="CashMate Logo"
        class="pw-brand__logo"
      />

      <h1 class="pw-brand__title">Welcome to<br />CashMate</h1>
      <p class="pw-brand__tagline">Your awesome financial partner</p>
    </header>

    <section class="pw-panel">
      <h2 class="pw-panel__heading">Reset your password</h2>

      @if (sent) {
        <p class="pw-forgot__sent">
          If an account exists for that email, a password reset link is on
          its way. Open it to choose a new password — we'll bring you back
          here afterwards.
        </p>
      } @else {
        <div class="pw-field">
          <label for="forgot-email">Email</label>
          <ion-input
            id="forgot-email"
            type="email"
            fill="solid"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
          ></ion-input>
        </div>

        <ion-button class="pw-btn" expand="block" (click)="sendResetLink()">
          Send Reset Link
        </ion-button>
      }

      <p class="pw-link-row">
        <a routerLink="/welcome">Back to Log In</a>
      </p>
    </section>
  </div>
</ion-content>
