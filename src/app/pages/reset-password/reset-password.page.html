<ion-content class="pw-page" [fullscreen]="true">
  <div class="pw-shell">
    <header class="pw-brand">
      <img
        src="assets/logo (2).png"
        alt="CashMate Logo"
        class="pw-brand__logo"
      />

      <h1 class="pw-brand__title">Welcome to<br />CashMate</h1>
      <p class="pw-brand__tagline">Your awesome financial partner</p>
    </header>

    <section class="pw-panel">
      <h2 class="pw-panel__heading">{{ headline }}</h2>

      <p class="pw-reset__message">{{ message }}</p>

      <ion-button class="pw-btn" expand="block" (click)="backToLogin()">
        Go to Log In
      </ion-button>

      <p class="pw-link-row">
        <a routerLink="/forgot-password">Need a new reset link?</a>
      </p>
    </section>
  </div>
</ion-content>
